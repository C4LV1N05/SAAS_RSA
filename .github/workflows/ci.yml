name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Domain engine tests (BCEA, PAYE/UIF/SDL/ETI, tips, hash chain)
        run: pnpm --filter @saas-rsa/domain test
      - name: Worker tests (Twilio adapters, channel fallback)
        run: pnpm --filter @saas-rsa/worker test
      - run: pnpm build
      - name: Compile Azure infrastructure (Bicep)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/bicep" https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x "$RUNNER_TEMP/bicep"
          "$RUNNER_TEMP/bicep" build infra/azure/main.bicep --stdout > /dev/null

  integration:
    name: Migrations, RLS and API tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saas_owner
          POSTGRES_PASSWORD: saas_owner
          POSTGRES_DB: saas_rsa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saas_owner -d saas_rsa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_OWNER_URL: postgres://saas_owner:saas_owner@localhost:5432/saas_rsa
      # The API connects as saas_app, which is subject to RLS; the tests use it too.
      DATABASE_URL: postgres://saas_app:saas_app@localhost:5432/saas_rsa
      # The worker connects as saas_worker, which may only call the outbox functions.
      DATABASE_WORKER_URL: postgres://saas_worker:saas_worker@localhost:5432/saas_rsa
      APP_DB_PASSWORD: saas_app
      WORKER_DB_PASSWORD: saas_worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Re-apply migrations (must be a no-op)
        run: pnpm db:migrate
      - name: Seed national rules and public holidays
        run: pnpm --filter @saas-rsa/db seed
      - name: Row-level security tests (tenant isolation as saas_app)
        run: pnpm --filter @saas-rsa/db test
      - name: End-to-end API tests (incl. Auth0 claims endpoint)
        run: pnpm --filter @saas-rsa/api test
      - name: Outbox worker tests (as saas_worker)
        run: pnpm --filter @saas-rsa/worker test

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: integration
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (registry names must be lowercase)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          # Pull requests build only; pushes to main also publish the image.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:main
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy to Azure (South Africa North)
    runs-on: ubuntu-latest
    needs: images
    # Runs once the Azure variables are set in GitHub (see docs/DEPLOY_AZURE.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC login: no Azure secrets stored in GitHub
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      PREFIX: ${{ vars.AZURE_NAME_PREFIX || 'saasrsa' }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Image names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "API_IMAGE=ghcr.io/${repo}-api:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=ghcr.io/${repo}-worker:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - run: az extension add --name containerapp --upgrade --only-show-errors
      - name: Run database migrations (release job)
        run: |
          az containerapp job update -g "$RG" -n "$PREFIX-migrate" --image "$API_IMAGE" --only-show-errors > /dev/null
          execution=$(az containerapp job start -g "$RG" -n "$PREFIX-migrate" --query name -o tsv)
          echo "Started $execution"
          for i in $(seq 1 60); do
            status=$(az containerapp job execution show -g "$RG" -n "$PREFIX-migrate" --job-execution-name "$execution" --query properties.status -o tsv)
            echo "status: $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) echo "::error::Migration job $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Migration job timed out"; exit 1
      - name: Roll out API and worker
        run: |
          az containerapp update -g "$RG" -n "$PREFIX-api" --image "$API_IMAGE" --only-show-errors > /dev/null
          az containerapp update -g "$RG" -n "$PREFIX-worker" --image "$WORKER_IMAGE" --only-show-errors > /dev/null
      - name: Smoke test
        run: |
          fqdn=$(az containerapp show -g "$RG" -n "$PREFIX-api" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -fsS "https://$fqdn/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::API did not become healthy"; exit 1
