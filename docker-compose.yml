services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: saas_owner
      POSTGRES_PASSWORD: saas_owner
      POSTGRES_DB: saas_rsa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_owner -d saas_rsa"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
